// Units: metres. x = west(0) -> east(4.0), z = north(0) -> south(4.9), y = up.

function mat(color, rough=0.8, metal=0, extra={}) { return new THREE.MeshStandardMaterial(Object.assign({color, roughness:rough, metalness:metal}, extra)); }
function box(x0,x1,y0,y1,z0,z1,m,cast=true,recv=true){
  const g = new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const o = new THREE.Mesh(g,m); o.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  o.castShadow=cast; o.receiveShadow=recv; scene.add(o); return o;
}
function rbox(w,h,d,r,m,x,y,z,parent){ const sh=new THREE.Shape(); const ww=w-2*r, hh=h-2*r;
  sh.moveTo(-ww/2,-hh/2); sh.lineTo(ww/2,-hh/2); sh.lineTo(ww/2,hh/2); sh.lineTo(-ww/2,hh/2); sh.lineTo(-ww/2,-hh/2);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(d-2*r,0.001),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:10,curveSegments:12});
  g.translate(0,0,-(d-2*r)/2); g.computeVertexNormals(); const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; (parent||scene).add(o); return o; }
function cyl(x,y,z,r0,r1,h,m,seg=32){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,seg),m); o.position.set(x,y,z); o.castShadow=true;o.receiveShadow=true; scene.add(o); return o; }
function canvasTex(w,h,draw,rx=1,ry=1){ const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function rnd(s){ return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }

// ---------- Materials ----------
const oak = mat('#ffffff',0.55,0,{map: canvasTex(1024,1024,(g,w,h)=>{
  const r=rnd(7); const plank=w/6;

    for(let k=0;k<70;k++){ g.strokeStyle=`rgba(120,85,50,${0.04+r()*0.06})`; g.lineWidth=1+r()*2; const x=i*plank+r()*plank; g.beginPath(); g.moveTo(x,0); g.bezierCurveTo(x+r()*10-5,h/3,x+r()*10-5,2*h/3,x+r()*6-3,h); g.stroke(); }
    g.fillStyle='rgba(90,60,35,0.35)'; g.fillRect(i*plank,0,2,h); const cut=r()*h; g.fillRect(i*plank,cut,plank,2); }
},2.2,1.2)});

const ceilingM = mat('#f6f3ee',0.95);
const walnut = mat('#5a3a24',0.55,0,{map: canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#6a4529'; g.fillRect(0,0,w,h); const r=rnd(11);
  for(let i=0;i<160;i++){ g.strokeStyle=`rgba(${r()<0.5?40:120},${r()<0.5?25:80},${r()<0.5?15:50},${0.15+r()*0.2})`; g.lineWidth=1+r()*3; const y=r()*h; g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(w/3,y+r()*20-10,2*w/3,y+r()*20-10,w,y+r()*10-5); g.stroke(); } })});

  for(let i=0;i<120;i++){ g.strokeStyle=`rgba(170,150,120,${0.1+r()*0.2})`; g.lineWidth=0.5+r()*2; const y=r()*h; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y+r()*8-4); g.stroke(); }
  for(let i=0;i<300;i++){ g.fillStyle=`rgba(160,140,110,${r()*0.3})`; g.fillRect(r()*w,r()*h,1+r()*4,1); } })});

const taupeBoucle = mat('#ffffff',1,0,{map: canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#a8998a'; g.fillRect(0,0,w,h); const r=rnd(17);
  for(let i=0;i<4000;i++){ const v=r(); g.fillStyle=v<0.5?'rgba(215,205,190,0.45)':'rgba(110,98,86,0.35)'; g.beginPath(); g.arc(r()*w,r()*h,0.8+r()*1.8,0,7); g.fill(); } },3,3)});

  const sky=g.createLinearGradient(0,0,0,h); sky.addColorStop(0,'#e9f1f6'); sky.addColorStop(0.55,'#f7f4ea'); sky.addColorStop(1,'#cbd8c0'); g.fillStyle=sky; g.fillRect(0,0,w,h);
  const r=rnd(31); for(let i=0;i<260;i++){ const x=r()*w, y=h*0.45+r()*h*0.5, s=20+r()*70; g.fillStyle=`rgba(${90+r()*60|0},${130+r()*60|0},${80+r()*40|0},${0.25+r()*0.3})`; g.beginPath(); g.arc(x,y,s,0,7); g.fill(); }
})}));
outside.position.set(2,1.6,RL+2.2); outside.rotation.y=Math.PI; scene.add(outside);

// ---------- Curtains: slim white track fixed flush to flat ceiling ----------
box(0.68,3.32,CH-0.03,CH,RL-0.12,RL-0.08,mat('#f4f2ee',0.5),false);
function drape(x0,x1,z,m,folds,depth){
  const w=x1-x0, segs=folds*8, g=new THREE.PlaneGeometry(w,CH-0.04,segs,1);
  const p=g.attributes.position; for(let i=0;i<p.count;i++){ const u=(p.getX(i)+w/2)/w; p.setZ(i, Math.sin(u*folds*Math.PI*2)*depth); }
  g.computeVertexNormals(); const o=new THREE.Mesh(g,m); o.position.set((x0+x1)/2,(CH-0.04)/2,z); o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
drape(0.7,1.05,RL-0.16,linen,6,0.03); drape(2.95,3.3,RL-0.16,linen,6,0.03);   // linen drapes pulled open
drape(1.0,3.0,RL-0.1,sheerM,22,0.02);                                       // sheer drawn across

// ---------- Rug ----------

// ---------- King bed (centre z = 2.85) ----------
const bz0=1.885, bz1=3.815, bx0=1.05, bx1=3.15;
rbox(bx1-bx0,0.28,bz1-bz0,0.04,boucle,(bx0+bx1)/2,0.2,(bz0+bz1)/2);
box(bx0+0.02,bx1-0.02,0.0,0.06,bz0+0.05,bz1-0.05,mat('#3a2a1e',0.6)); // shadow gap plinth
rbox(bx1-bx0-0.06,0.26,bz1-bz0-0.06,0.06,sheet,(bx0+bx1)/2,0.45,(bz0+bz1)/2);
// duvet folded back over the foot two-thirds, draping over sides
rbox(2.38-bx0,0.27,bz1-bz0+0.05,0.05,duvet,(bx0+2.38)/2-0.01,0.47,(bz0+bz1)/2).receiveShadow=false;
{const roll=new THREE.Mesh(new THREE.CapsuleGeometry(0.05,bz1-bz0-0.02,8,16),duvet); roll.rotation.x=Math.PI/2; roll.position.set(2.36,0.6,(bz0+bz1)/2); roll.castShadow=false; scene.add(roll);}
// knit throw at an angle near foot
rbox(0.5,0.04,bz1-bz0+0.12,0.015,knit,1.45,0.615,(bz0+bz1)/2).castShadow=false;
// headboard: channel tufted ivory boucle mounted on walnut wall
for(let i=0;i<9;i++){ const z0=bz0-0.05+i*((bz1-bz0+0.1)/9); const ch=box(3.13,3.2,0.32,1.15,z0+0.006,z0+(bz1-bz0+0.1)/9-0.006,boucle); }
box(3.2,3.3,0,1.2,1.4,4.3,walnut);                           // freestanding headboard wall

// pillows

for(const zc of [2.45,3.25]){ pillow(3.03,0.86,zc,0.74,0.6,0.18,mat('#f8f6f1',0.85),0.18); pillow(2.88,0.78,zc,0.68,0.44,0.17,mat('#efe9df',0.85),0.22); }

for(const [z0,z1] of [[1.385,1.885],[3.815,4.315]]){
  box(2.72,3.2,0.0,0.52,z0+0.02,z1-0.02,walnut);
  for(let k=0;k<10;k++){ const zz=z0+0.05+k*0.04; box(2.705,2.72,0.08,0.45,zz,zz+0.022,walnut); } // fluted front
  box(2.69,3.2,0.52,0.56,z0,z1,travertine);
  box(2.69,2.70,0.26,0.28,(z0+z1)/2-0.08,(z0+z1)/2+0.08,brass);              // pull

  const pg=new THREE.Mesh(new THREE.SphereGeometry(0.085,32,16),mat('#f7f1e6',0.35,0,{emissive:'#fff1d8',emissiveIntensity:0.15})); pg.position.set(2.95,1.5,(z0+z1)/2); pg.castShadow=true; scene.add(pg);
  cyl(2.95,1.59,(z0+z1)/2,0.025,0.025,0.035,brass);
}

cyl(3.05,0.72,3.9,0.004,0.004,0.1,mat('#5d7a4c',0.8),6); pillow(3.05,0.78,3.9,0.05,0.04,0.05,mat('#fffaf2',0.7),0);
// north nightstand: small clock + tray

// ---------- Feature wall (west): fluted walnut panelling centred on bed z = 2.85, no TV ----------
for(let i=0;i<40;i++){ const z0=1.85+i*0.05; const fl=cyl(0.025,CH/2,z0+0.025,0.022,0.022,CH,walnut,12); }

cyl(1.43,0.25,4.58,0.2,0.2,0.5,travertine); cyl(1.43,0.52,4.58,0.21,0.21,0.04,travertine);
box(1.33,1.5,0.54,0.57,4.48,4.66,mat('#c9b48e',0.8)); cyl(1.52,0.58,4.62,0.04,0.035,0.08,mat('#fdfbf6',0.3));
