<script>
// Units: metres. x = west(0) -> east(4.0), z = north(0) -> south(4.9), y = up.
const P = new URLSearchParams(location.search);

renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();

function mat(color, rough=0.8, metal=0, extra={}) { return new THREE.MeshStandardMaterial(Object.assign({color, roughness:rough, metalness:metal}, extra)); }
function box(x0,x1,y0,y1,z0,z1,m,cast=true,recv=true){
  const g = new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const o = new THREE.Mesh(g,m); o.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  o.castShadow=cast; o.receiveShadow=recv; scene.add(o); return o;
}
function rbox(w,h,d,r,m,x,y,z,parent){ const sh=new THREE.Shape(); const ww=w-2*r, hh=h-2*r;
  sh.moveTo(-ww/2,-hh/2); sh.lineTo(ww/2,-hh/2); sh.lineTo(ww/2,hh/2); sh.lineTo(-ww/2,hh/2); sh.lineTo(-ww/2,-hh/2);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(d-2*r,0.001),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:10,curveSegments:12});
  g.translate(0,0,-(d-2*r)/2); g.computeVertexNormals(); const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; (parent||scene).add(o); return o; }
function cyl(x,y,z,r0,r1,h,m,seg=32){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,seg),m); o.position.set(x,y,z); o.castShadow=true;o.receiveShadow=true; scene.add(o); return o; }
function canvasTex(w,h,draw,rx=1,ry=1){ const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function rnd(s){ return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }

// ---------- Materials ----------
const oak = mat('#ffffff',0.55,0,{map: canvasTex(1024,1024,(g,w,h)=>{
  const r=rnd(7); const plank=w/6;
  for(let i=0;i<6;i++){ const base=200+r()*18; g.fillStyle=`rgb(${base},${base*0.83|0},${base*0.62|0})`; g.fillRect(i*plank,0,plank,h);
    for(let k=0;k<70;k++){ g.strokeStyle=`rgba(120,85,50,${0.04+r()*0.06})`; g.lineWidth=1+r()*2; const x=i*plank+r()*plank; g.beginPath(); g.moveTo(x,0); g.bezierCurveTo(x+r()*10-5,h/3,x+r()*10-5,2*h/3,x+r()*6-3,h); g.stroke(); }
    g.fillStyle='rgba(90,60,35,0.35)'; g.fillRect(i*plank,0,2,h); const cut=r()*h; g.fillRect(i*plank,cut,plank,2); }
},2.2,1.2)});
// ---------- Colour palettes (choose with ?pal=...) - floor is always light grey carpet ----------
const PALS={
  grey:  {wall:'#e2e1de',ceil:'#f6f6f4',timber:'#57534f',stone:'#ecebe9',vein:'140,142,145',boucle:'#e4e3e0',chair:'#a6a6a3',sheet:'#fbfbfa',duvet:'#d2d3d1',accent:'#5f6b74',throw:'#7d7d7b',metal:'#b9bdc0',linen:'#cfcecb',pillowA:'#f7f7f6',pillowB:'#e2e3e2',

          art:['#ece3d4','#d9c7ad','#b89f84','#c77d5a','#3f4a52','#efe6d6','#a68c72']},

};

function hexRGB(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function speckle(base,w,h,n,rad,lightA,darkA,seed){ return (g)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); const r=rnd(seed); const [R,G,B]=hexRGB(base);
  for(let i=0;i<n;i++){ const v=r()<0.5; g.fillStyle=v?`rgba(${Math.min(255,R+35)},${Math.min(255,G+35)},${Math.min(255,B+35)},${lightA})`:`rgba(${R*0.7|0},${G*0.7|0},${B*0.7|0},${darkA})`; g.beginPath(); g.arc(r()*w,r()*h,rad[0]+r()*rad[1],0,7); g.fill(); } }; }
const plaster = mat('#ffffff',0.95,0,{map: canvasTex(512,512,speckle(PAL.wall,512,512,3000,[4,30],0.05,0.04,3),2,2)});

  for(let i=0;i<160;i++){ const k=r()<0.5?0.7:1.25; g.strokeStyle=`rgba(${Math.min(255,R*k)|0},${Math.min(255,G*k)|0},${Math.min(255,B*k)|0},${0.15+r()*0.2})`; g.lineWidth=1+r()*3; const y=r()*h; g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(w/3,y+r()*20-10,2*w/3,y+r()*20-10,w,y+r()*10-5); g.stroke(); } })});
const travertine = mat('#ffffff',0.6,0,{map: canvasTex(512,512,(g,w,h)=>{ g.fillStyle=PAL.stone; g.fillRect(0,0,w,h); const r=rnd(5);
  for(let i=0;i<120;i++){ g.strokeStyle=`rgba(${PAL.vein},${0.08+r()*0.18})`; g.lineWidth=0.5+r()*2; const y=r()*h; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y+r()*8-4); g.stroke(); } })});
const boucle = mat('#ffffff',1,0,{map: canvasTex(256,256,speckle(PAL.boucle,256,256,4000,[0.8,1.8],0.45,0.3,13),3,3)});

const knit = mat('#ffffff',1,0,{map: canvasTex(256,256,(g,w,h)=>{ g.fillStyle=PAL.throw; g.fillRect(0,0,w,h); for(let x=0;x<w;x+=16){ for(let y=0;y<h;y+=12){ g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(x+8,y+6,6,5,0,0,7); g.fill(); g.fillStyle='rgba(255,255,255,0.18)'; g.beginPath(); g.ellipse(x+6,y+4,3,2,0,0,7); g.fill(); } } },4,4)});

  for(let i=0;i<14000;i++){ const v=r(); g.fillStyle=v<0.5?`rgba(235,235,232,${0.25+r()*0.2})`:`rgba(150,150,148,${0.2+r()*0.2})`; g.fillRect(r()*w,r()*h,1+r()*1.5,1+r()*2); } },8,10)});

const glassM = new THREE.MeshPhysicalMaterial({color:'#fff6e6',roughness:0.15,transmission:0.6,transparent:true,opacity:0.55});

for(const [z0,z1] of [[2.28,2.4],[3.3,3.42]]){ box(RW,RW+0.25,0,CH,z0,z1,plaster); box(RW+1.0,RW+1.3,0,CH,z0,z1,plaster); box(RW+0.25,RW+1.0,2.1,CH,z0,z1,plaster); }
box(RW,RW+1.42,CH,CH+0.02,2.28,3.42,ceilingM,false);
// robe interiors (glimpse): shelving + hanging rail
for(const [zw,zr] of [[1.2,2.0],[3.7,3.0]]){ box(RW,RW+1.3,-0.01,0,Math.min(zw,zr)-0.3,Math.max(zw,zr)+0.3,carpet,false,true);
  box(RW+0.05,RW+1.25,0,CH,zw<2?1.1:3.95,zw<2?1.15:4.0,plaster);
  box(RW+0.1,RW+1.2,0.4,2.0,zw<2?1.15:3.4,zw<2?1.7:3.95,mat('#efe9df',0.8));
  cyl(RW+0.65,1.75,zw<2?1.85:3.25,0.012,0.012,1.1,brass,8).rotation.z=Math.PI/2; }
// ensuite end wall with 0.8m doorway, light tiled ensuite beyond
box(RW+1.3,RW+1.42,0,CH,2.28,2.45,plaster); box(RW+1.3,RW+1.42,0,CH,3.25,3.42,plaster); box(RW+1.3,RW+1.42,2.1,CH,2.45,3.25,plaster);
{ const tile=mat('#ffffff',0.35,0,{map:canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#ebe7e0'; g.fillRect(0,0,w,h); g.strokeStyle='rgba(160,150,140,0.5)'; g.lineWidth=2; for(let i=0;i<=4;i++){ g.beginPath(); g.moveTo(0,i*64); g.lineTo(w,i*64); g.stroke(); g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,h); g.stroke(); } },3,3)});
  box(RW+1.42,RW+2.6,-0.01,0,1.8,3.9,tile,false,true); box(RW+2.6,RW+2.7,0,CH,1.8,3.9,tile); box(RW+1.42,RW+2.6,CH,CH+0.02,1.8,3.9,ceilingM,false);
  box(RW+1.42,RW+2.6,0,CH,1.7,1.8,tile); box(RW+1.42,RW+2.6,0,CH,3.9,4.0,tile);
  box(RW+2.1,RW+2.6,0.8,0.85,2.3,3.4,mat('#f4f1ec',0.4)); const ensL=new THREE.PointLight('#fff4e2',1.2,4,1.8); ensL.position.set(RW+2.0,2.0,2.85); scene.add(ensL); }
box(RW,RW+1.3,-0.01,0,2.3,3.4,carpet,false,true);
// outside: soft garden backdrop
// hallway behind entry door
box(RW,RW+1.4,-0.01,0,0,1.1,oak,false,true); box(RW,RW+1.4,CH,CH+0.02,0,1.1,ceilingM,false);
box(RW+1.4,RW+1.52,0,CH,0,1.1,plaster); box(RW,RW+1.4,0,CH,-T,0,plaster); box(RW,RW+1.4,0,CH,1.1,1.22,plaster);
box(RW-0.02,RW+T+0.02,2.06,2.1,0.1,1.0,mat('#f4f1ec',0.6)); // architrave head
box(3.12,3.98,0,2.05,0.1,0.14,mat('#f4f1ec',0.55));          // door leaf open against north wall

// outside
const outside = new THREE.Mesh(new THREE.PlaneGeometry(14,7), new THREE.MeshBasicMaterial({map: canvasTex(1024,512,(g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h); sky.addColorStop(0,'#e9f1f6'); sky.addColorStop(0.55,'#f7f4ea'); sky.addColorStop(1,'#cbd8c0'); g.fillStyle=sky; g.fillRect(0,0,w,h);
  const r=rnd(31); for(let i=0;i<260;i++){ const x=r()*w, y=h*0.45+r()*h*0.5, s=20+r()*70; g.fillStyle=`rgba(${90+r()*60|0},${130+r()*60|0},${80+r()*40|0},${0.25+r()*0.3})`; g.beginPath(); g.arc(x,y,s,0,7); g.fill(); }

// ---------- 90mm cove cornice between walls and ceiling (approx. 65mm drop x 65mm projection) ----------
{ const r=0.065, sh=new THREE.Shape(); sh.moveTo(0,0); sh.lineTo(0,-r); sh.absarc(r,-r,r,Math.PI,Math.PI/2,true); sh.lineTo(0,0);
  const corniceM=mat('#f7f4ef',0.9,0,{side:THREE.DoubleSide});
  function cornice(len,px,pz,rotY){ const g=new THREE.ExtrudeGeometry(sh,{depth:len,bevelEnabled:false,curveSegments:16}); const o=new THREE.Mesh(g,corniceM); o.position.set(px,CH,pz); o.rotation.y=rotY; o.receiveShadow=true; scene.add(o); }
  cornice(RL,0,0,0);              // west wall
  cornice(RW,RW,0,-Math.PI/2);    // north wall
  cornice(RW,0,RL,Math.PI/2);     // south wall
  cornice(RL,RW,RL,Math.PI);      // east wall
}
// ---------- Curtains: slim white track fixed flush to flat ceiling ----------
box(0.68,3.32,CH-0.03,CH,RL-0.12,RL-0.08,mat('#f4f2ee',0.5),false);
function drape(x0,x1,z,m,folds,depth){
  const w=x1-x0, segs=folds*8, g=new THREE.PlaneGeometry(w,CH-0.04,segs,1);
  const p=g.attributes.position; for(let i=0;i<p.count;i++){ const u=(p.getX(i)+w/2)/w; p.setZ(i, Math.sin(u*folds*Math.PI*2)*depth); }
  g.computeVertexNormals(); const o=new THREE.Mesh(g,m); o.position.set((x0+x1)/2,(CH-0.04)/2,z); o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
drape(0.7,1.05,RL-0.16,linen,6,0.03); drape(2.95,3.3,RL-0.16,linen,6,0.03);   // linen drapes pulled open
drape(1.0,3.0,RL-0.1,sheerM,22,0.02);                                       // sheer drawn across

// ---------- Rug ----------
// (no rug - wall-to-wall carpet)

// ---------- LAYOUT B: Nick Scali Elyse king bed, head to the SOUTH window, 400 mm gap ----------
// Elyse: 2060 W x 2430 L, headboard 930 H (fabric assumed Warm Linen; headboard style assumed plain padded)
const GAPB=0.40, BW=2.06, BL=2.43, HBZ=RL-GAPB, FZ=HBZ-BL, bx0=2.0-BW/2, bx1=2.0+BW/2;
const linenM = mat('#ffffff',1,0,{map: canvasTex(256,256,speckle('#d8ccba',256,256,4000,[0.8,1.6],0.3,0.25,23),3,3)});

box(bx0+0.08,bx1-0.08,0.0,0.05,FZ+0.08,HBZ-0.18,mat('#2c2b2a',0.6));                     // recessed plinth

{const roll=new THREE.Mesh(new THREE.CapsuleGeometry(0.05,BW-0.04,8,16),duvet); roll.rotation.z=Math.PI/2; roll.position.set(2.0,0.6,DFOLD); roll.castShadow=false; scene.add(roll);}
rbox(BW+0.12,0.04,0.5,0.015,knit,2.0,0.615,FZ+0.42).castShadow=false;                   // knit throw across the foot

  box(x0,x1,0.52,0.56,NSZ0-0.02,NSZ1,travertine);
  box((x0+x1)/2-0.08,(x0+x1)/2+0.08,0.26,0.28,NSZ0-0.03,NSZ0-0.015,brass);                       // pull
  cyl((x0+x1)/2,1.98,NSZ0+0.12,0.004,0.004,0.84,brass,6);                                          // pendant rod
  const pg=new THREE.Mesh(new THREE.SphereGeometry(0.085,32,16),mat('#f7f1e6',0.35,0,{emissive:'#fff1d8',emissiveIntensity:0.15})); pg.position.set((x0+x1)/2,1.5,NSZ0+0.12); pg.castShadow=true; scene.add(pg);
