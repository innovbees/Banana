<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="670" viewBox="0 0 1260 670" font-family="Helvetica, Arial, sans-serif"><rect width="1260" height="670" fill="#ffffff"/><text x="10" y="36" font-size="21" font-weight="700" fill="#2b2622">Sliding door vs the cove cornice - three ways to fix the track (section, mm)</text><text x="10" y="62" font-size="13.5" fill="#6b625a">Looking along the east wall; bedroom on the left of each sketch, robe walkway opening behind the door</text><g transform="translate(10 0)"><g transform="translate(0 0)"><rect x="0" y="90" width="400" height="560" rx="10" fill="#fbfaf8" stroke="#ddd6cc"/><text x="20" y="122" font-size="17" font-weight="700" fill="#2b2622">A. Track clear of the cornice</text><text x="20" y="144" font-size="12.5" fill="#6b625a">Cornice stays as it is</text><rect x="20" y="158" width="360" height="22" fill="#d9d2c8"/><rect x="330" y="158" width="50" height="420" fill="#d9d2c8"/><text x="355" y="410" font-size="11" fill="#6b625a" text-anchor="middle" transform="rotate(-90 355 410)">east wall</text><text x="40" y="174" font-size="11" fill="#6b625a">ceiling</text><path d="M330 180L330 284.0A104.0 104.0 0 0 0 226.0 180Z" fill="#f3efe8" stroke="#2b2622" stroke-width="1.2"/><text x="322" y="308" font-size="11" fill="#6b625a" text-anchor="end">cove cornice</text><text x="322" y="322" font-size="11" fill="#6b625a" text-anchor="end">~65 x 65</text><rect x="140.0" y="180" width="44" height="26" fill="#2b2622"/><rect x="146.0" y="210" width="32" height="330" fill="#7a5233"/><text x="162.0" y="390" font-size="12" fill="#fff" text-anchor="middle" transform="rotate(-90 162.0 390)">door 40 thick</text><line x1="162.0" y1="560" x2="330" y2="560" stroke="#2b2622" stroke-width="1"/><line x1="162.0" y1="555" x2="162.0" y2="565" stroke="#2b2622"/><line x1="330" y1="555" x2="330" y2="565" stroke="#2b2622"/><text x="246.0" y="554" font-size="11.5" fill="#2b2622" text-anchor="middle">~105 track centre to wall</text><text x="132.0" y="196" font-size="11" fill="#2b2622" text-anchor="end">ceiling track</text><text x="320" y="510" font-size="11" fill="#6b625a" text-anchor="end">gap behind door</text><rect x="20" y="575" width="360" height="60" rx="8" fill="#fff" stroke="#1e8449"/><text x="34" y="598" font-size="12.5" fill="#1e8449" font-weight="700">Simplest - recommended</text><text x="34" y="617" font-size="12.5" fill="#2b2622" font-weight="400">Door stands ~85 off the wall; walkway ~850</text></g><g transform="translate(420 0)"><rect x="0" y="90" width="400" height="560" rx="10" fill="#fbfaf8" stroke="#ddd6cc"/><text x="20" y="122" font-size="17" font-weight="700" fill="#2b2622">B. Cut back the cornice</text><text x="20" y="144" font-size="12.5" fill="#6b625a">Track tight to wall, plasterer patches</text><rect x="20" y="158" width="360" height="22" fill="#d9d2c8"/><rect x="330" y="158" width="50" height="420" fill="#d9d2c8"/><text x="355" y="410" font-size="11" fill="#6b625a" text-anchor="middle" transform="rotate(-90 355 410)">east wall</text><text x="40" y="174" font-size="11" fill="#6b625a">ceiling</text><rect x="282.8" y="180" width="44" height="26" fill="#2b2622"/><rect x="288.8" y="210" width="32" height="330" fill="#7a5233"/><path d="M330 180L330 284A104 104 0 0 0 226 180Z" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="215" y="240" font-size="11" fill="#c0392b" text-anchor="end">cornice cut out</text><text x="215" y="254" font-size="11" fill="#c0392b" text-anchor="end">over ~2.1 m run</text><line x1="304.8" y1="560" x2="330" y2="560" stroke="#2b2622" stroke-width="1"/><line x1="304.8" y1="555" x2="304.8" y2="565" stroke="#2b2622"/><line x1="330" y1="555" x2="330" y2="565" stroke="#2b2622"/><text x="317.4" y="554" font-size="11.5" fill="#2b2622" text-anchor="middle">~45</text><rect x="20" y="575" width="360" height="60" rx="8" fill="#fff" stroke="#2b2622"/><text x="34" y="598" font-size="12.5" fill="#2b2622" font-weight="700">Slimmest door line, small gap</text><text x="34" y="617" font-size="12.5" fill="#2b2622" font-weight="400">Needs a plasterer; cornice ends neatly</text></g><g transform="translate(840 0)"><rect x="0" y="90" width="400" height="560" rx="10" fill="#fbfaf8" stroke="#ddd6cc"/><text x="20" y="122" font-size="17" font-weight="700" fill="#2b2622">C. Wall track below the cornice</text><text x="20" y="144" font-size="12.5" fill="#6b625a">Door ~2.25 m high, pelmet on top</text><rect x="20" y="158" width="360" height="22" fill="#d9d2c8"/><rect x="330" y="158" width="50" height="420" fill="#d9d2c8"/><text x="355" y="410" font-size="11" fill="#6b625a" text-anchor="middle" transform="rotate(-90 355 410)">east wall</text><text x="40" y="174" font-size="11" fill="#6b625a">ceiling</text><path d="M330 180L330 284.0A104.0 104.0 0 0 0 226.0 180Z" fill="#f3efe8" stroke="#2b2622" stroke-width="1.2"/><text x="220.0" y="210" font-size="11" fill="#6b625a" text-anchor="end">cove cornice</text><text x="220.0" y="224" font-size="11" fill="#6b625a" text-anchor="end">~65 x 65</text><rect x="286" y="295" width="44" height="22" fill="#2b2622"/><rect x="210" y="290" width="76" height="32" fill="#e9dccb" stroke="#2b2622"/><text x="248" y="310" font-size="10.5" fill="#2b2622" text-anchor="middle">pelmet</text><rect x="290" y="320" width="32" height="220" fill="#7a5233"/><text x="204" y="280" font-size="11" fill="#6b625a" text-anchor="end">top ~110 of the opening</text><text x="204" y="294" font-size="11" fill="#6b625a" text-anchor="end">above the door: fill or pelmet</text><rect x="20" y="575" width="360" height="60" rx="8" fill="#fff" stroke="#c0392b"/><text x="34" y="598" font-size="12.5" fill="#c0392b" font-weight="700">Works, but the full-height look is lost</text><text x="34" y="617" font-size="12.5" fill="#2b2622" font-weight="400">Needs a filler panel above the door</text></g></g></svg>