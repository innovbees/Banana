<svg xmlns="http://www.w3.org/2000/svg" width="860" height="820" viewBox="0 0 860 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="820" fill="#ffffff"/>
  <text x="80" y="34" font-size="20" font-weight="bold" fill="#222">Bedroom 1 — proposed layout (4.0m × 4.9m)</text>
  <text x="80" y="54" font-size="12" fill="#666">Scale approx. 1:40 · 1m = 120px · all furniture to scale</text>

  <!-- North arrow -->
  <g transform="translate(800,60)">
    <polygon points="0,-22 9,8 0,2 -9,8" fill="#222"/>
    <text x="0" y="26" font-size="14" font-weight="bold" text-anchor="middle">N</text>
  </g>

  <!-- floor -->
  <rect x="80" y="90" width="480" height="588" fill="#f6f1ea"/>

  <!-- Robes / ensuite context (outside room, east) -->
  <rect x="564" y="186" width="156" height="192" fill="#ebe7e2" stroke="#999" stroke-width="2"/>
  <text x="642" y="280" font-size="14" text-anchor="middle" fill="#555">WIR 1</text>
  <rect x="564" y="486" width="156" height="192" fill="#ebe7e2" stroke="#999" stroke-width="2"/>
  <text x="642" y="594" font-size="14" text-anchor="middle" fill="#555">WIR 2</text>
  <rect x="564" y="378" width="156" height="108" fill="#f2efe9"/>
  <text x="642" y="426" font-size="12" text-anchor="middle" fill="#555">walkway 0.9m</text>
  <text x="642" y="444" font-size="12" text-anchor="middle" fill="#555">to ensuite →</text>
  <text x="790" y="440" font-size="14" text-anchor="middle" fill="#555" transform="rotate(90 790 440)">ENSUITE</text>

  <!-- Walls -->
  <g stroke="#222" stroke-width="8" stroke-linecap="square" fill="none">
    <!-- north wall, gap for entry door 3.0m-3.9m (0.9m) -->
    <line x1="80" y1="90" x2="440" y2="90"/>
    <line x1="548" y1="90" x2="560" y2="90"/>
    <!-- west wall -->
    <line x1="80" y1="90" x2="80" y2="678"/>
    <!-- south wall, glass between 1.06m and 3.92m -->
    <line x1="80" y1="678" x2="207" y2="678"/>
    <line x1="550" y1="678" x2="560" y2="678"/>
    <!-- east wall, opening between WIRs 2.4m-3.3m (0.9m) -->
    <line x1="560" y1="90" x2="560" y2="378"/>
    <line x1="560" y1="486" x2="560" y2="678"/>
  </g>
  <!-- door jambs -->
  <g stroke="#222" stroke-width="3">
    <line x1="440" y1="82" x2="440" y2="98"/>
    <line x1="548" y1="82" x2="548" y2="98"/>
    <line x1="552" y1="378" x2="568" y2="378"/>
    <line x1="552" y1="486" x2="568" y2="486"/>
  </g>

  <!-- Glass sliding doors (south) -->
  <g stroke="#3b7ea1" stroke-width="2">
    <line x1="207" y1="674" x2="550" y2="674"/>
    <line x1="207" y1="682" x2="550" y2="682"/>
    <line x1="378" y1="670" x2="378" y2="686"/>
  </g>
  <rect x="80" y="690" width="480" height="40" fill="url(#hatch)" opacity="0.6"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#aaa" stroke-width="2"/>
    </pattern>
  </defs>
  <text x="378" y="748" font-size="12" text-anchor="middle" fill="#3b7ea1">GLASS SLIDING DOORS → BALCONY (assumed)</text>

  <!-- Entry door cut-out and swing (hinge at east jamb, swings into room) -->
  <path d="M440,90 A108,108 0 0,0 548,198" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="548" y1="90" x2="548" y2="198" stroke="#c0392b" stroke-width="4"/>
  <path d="M440,90 L548,90 L548,198 A108,108 0 0,1 440,90 Z" fill="#c0392b" opacity="0.08"/>
  <text x="572" y="120" font-size="12" fill="#c0392b" font-weight="bold">← ENTRY DOOR 0.9m</text><text x="572" y="136" font-size="11" fill="#c0392b">(north wall, NE corner)</text>

  <!-- Floating TV unit + TV (west wall) -->
  <rect x="84" y="252" width="36" height="264" fill="#7a5233" stroke="#4e3420" stroke-width="1.5"/>
  <rect x="84" y="309" width="6" height="174" fill="#111"/>
  <text x="102" y="384" font-size="11" fill="#fff" text-anchor="middle" transform="rotate(-90 102 384)">TV UNIT 2.2m · 65" TV</text>

  <!-- Rug under bed -->
  <rect x="180" y="238" width="270" height="292" rx="4" fill="#e9e2d6" stroke="#d6cbb8" stroke-width="1"/>

  <!-- King bed -->
  <rect x="206" y="268" width="258" height="232" rx="6" fill="#ffffff" stroke="#8a7a68" stroke-width="2"/>
  <rect x="206" y="268" width="130" height="232" rx="6" fill="#efe3c8" stroke="#8a7a68" stroke-width="1"/>
  <rect x="420" y="282" width="36" height="96" rx="10" fill="#f7f4ef" stroke="#a89886"/>
  <rect x="420" y="390" width="36" height="96" rx="10" fill="#f7f4ef" stroke="#a89886"/>
  <rect x="398" y="300" width="18" height="70" rx="6" fill="#b8a99a"/>
  <rect x="398" y="398" width="18" height="70" rx="6" fill="#b8a99a"/>
  <text x="300" y="380" font-size="14" text-anchor="middle" fill="#5c4033" font-weight="bold">KING BED</text>
  <text x="300" y="397" font-size="11" text-anchor="middle" fill="#5c4033">1.93 × 2.15m</text>

  <!-- Nightstands -->
  <rect x="410" y="208" width="54" height="56" fill="#7a5233" stroke="#4e3420"/>
  <rect x="410" y="504" width="54" height="56" fill="#7a5233" stroke="#4e3420"/>
  <circle cx="437" cy="236" r="9" fill="#f3e6c4" stroke="#b08d57" stroke-width="2"/>
  <circle cx="437" cy="532" r="9" fill="#f3e6c4" stroke="#b08d57" stroke-width="2"/>

  <!-- Headboard wall -->
  <rect x="464" y="210" width="12" height="348" fill="#4e3420"/>
  <text x="488" y="384" font-size="11" fill="#4e3420" text-anchor="middle" transform="rotate(90 488 384)">HEADBOARD WALL 2.9m × 1.2m high</text>

  <!-- Lounge nook (SW corner) -->
  <circle cx="160" cy="600" r="62" fill="#ece5da" stroke="#d6cbb8"/>
  <g transform="translate(166 596) rotate(-45)">
    <rect x="-40" y="-40" width="80" height="80" rx="22" fill="#b8a99a" stroke="#7d6e60" stroke-width="2"/>
    <rect x="-40" y="-40" width="80" height="20" rx="10" fill="#9c8d7e"/>
  </g>
  <circle cx="232" cy="634" r="22" fill="#e6dccb" stroke="#a89886" stroke-width="2"/>
  <circle cx="104" cy="546" r="9" fill="#b08d57"/>
  <text x="160" y="526" font-size="11" text-anchor="middle" fill="#555">LOUNGE CHAIR</text>
  <text x="232" y="638" font-size="9" text-anchor="middle" fill="#555">table</text>

  <!-- Dimensions -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="80" y1="72" x2="560" y2="72"/><line x1="80" y1="66" x2="80" y2="78"/><line x1="560" y1="66" x2="560" y2="78"/>
    <line x1="56" y1="90" x2="56" y2="678"/><line x1="50" y1="90" x2="62" y2="90"/><line x1="50" y1="678" x2="62" y2="678"/>
    <!-- foot walkway 0.75 -->
    <line x1="120" y1="440" x2="206" y2="440"/><line x1="120" y1="434" x2="120" y2="446"/><line x1="206" y1="434" x2="206" y2="446"/>
    <!-- walkway behind headboard 0.7 -->
    <line x1="476" y1="440" x2="560" y2="440"/><line x1="476" y1="434" x2="476" y2="446"/><line x1="560" y1="434" x2="560" y2="446"/>
    <!-- end clearance 1.0 -->
    <line x1="500" y1="90" x2="500" y2="210" stroke-dasharray="3,3"/>
    <line x1="500" y1="558" x2="500" y2="678" stroke-dasharray="3,3"/>
  </g>
  <text x="320" y="66" font-size="13" text-anchor="middle" fill="#333">4.0m</text>
  <text x="40" y="384" font-size="13" text-anchor="middle" fill="#333" transform="rotate(-90 40 384)">4.9m (west wall)</text>
  <text x="163" y="458" font-size="11" text-anchor="middle" fill="#333">0.75m</text>
  <text x="518" y="458" font-size="11" text-anchor="middle" fill="#333">0.7m</text>
  <text x="522" y="230" font-size="11" fill="#333">1.0m</text>
  <text x="522" y="626" font-size="11" fill="#333">1.0m</text>

  <!-- Legend -->
  <g font-size="11" fill="#444">
    <rect x="80" y="768" width="14" height="10" fill="#c0392b" opacity="0.5"/><text x="100" y="777">door swing (clear of headboard wall)</text>
    <rect x="320" y="768" width="14" height="10" fill="#7a5233"/><text x="340" y="777">walnut joinery</text>
    <line x1="450" y1="773" x2="470" y2="773" stroke="#3b7ea1" stroke-width="3"/><text x="476" y="777">glazing</text>
    <rect x="540" y="768" width="14" height="10" fill="#ebe7e2" stroke="#999"/><text x="560" y="777">robes (existing)</text>
  </g>
</svg>
