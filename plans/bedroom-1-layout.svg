<svg xmlns="http://www.w3.org/2000/svg" width="860" height="820" viewBox="0 0 860 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="820" fill="#ffffff"/>
  <text x="80" y="34" font-size="20" font-weight="bold" fill="#222">Bedroom 1 — proposed layout (4.0m × 4.9m)</text>
  <text x="80" y="54" font-size="12" fill="#666">Scale approx. 1:40 · 1m = 120px · ceiling height 2.4m · all furniture to scale</text>

  <!-- North arrow -->
  <g transform="translate(800,60)">
    <polygon points="0,-22 9,8 0,2 -9,8" fill="#222"/>
    <text x="0" y="26" font-size="14" font-weight="bold" text-anchor="middle">N</text>
  </g>

  <!-- floor -->
  <rect x="80" y="90" width="480" height="588" fill="#f6f1ea"/>

  <!-- Robes / ensuite context (outside room, east) -->
  <rect x="564" y="222" width="156" height="156" fill="#ebe7e2" stroke="#999" stroke-width="2"/>
  <text x="642" y="306" font-size="14" text-anchor="middle" fill="#555">WIR 1</text>
  <rect x="564" y="486" width="156" height="192" fill="#ebe7e2" stroke="#999" stroke-width="2"/>
  <text x="642" y="594" font-size="14" text-anchor="middle" fill="#555">WIR 2</text>
  <rect x="564" y="378" width="156" height="108" fill="#f2efe9"/>
  <text x="642" y="420" font-size="12" text-anchor="middle" fill="#555">walkway 0.9m</text>
  <text x="642" y="452" font-size="12" text-anchor="middle" fill="#555">to ensuite →</text>
  <text x="790" y="440" font-size="14" text-anchor="middle" fill="#555" transform="rotate(90 790 440)">ENSUITE</text>

  <!-- Walls -->
  <g stroke="#222" stroke-width="8" stroke-linecap="square" fill="none">
    <!-- north wall, solid -->
    <line x1="80" y1="90" x2="560" y2="90"/>
    <!-- west wall -->
    <line x1="80" y1="90" x2="80" y2="678"/>
    <!-- south wall, glass between 1.06m and 3.92m -->
    <line x1="80" y1="678" x2="182" y2="678"/>
    <line x1="458" y1="678" x2="560" y2="678"/>
    <!-- east wall, entry door 0.1m-1.0m, opening between WIRs 2.4m-3.3m (0.9m) -->
    <line x1="560" y1="90" x2="560" y2="102"/>
    <line x1="560" y1="210" x2="560" y2="378"/>
    <line x1="560" y1="486" x2="560" y2="678"/>
  </g>
  <!-- door jambs -->
  <g stroke="#222" stroke-width="3">
    <line x1="552" y1="102" x2="568" y2="102"/>
    <line x1="552" y1="210" x2="568" y2="210"/>
    <line x1="552" y1="378" x2="568" y2="378"/>
    <line x1="552" y1="486" x2="568" y2="486"/>
  </g>

  <!-- Glass sliding doors (south) -->
  <g stroke="#3b7ea1" stroke-width="2">
    <line x1="182" y1="674" x2="458" y2="674"/>
    <line x1="182" y1="682" x2="458" y2="682"/>
    <line x1="320" y1="670" x2="320" y2="686"/>
    <line x1="162" y1="664" x2="478" y2="664" stroke="#b8a99a" stroke-width="3" stroke-dasharray="2,3"/>
  </g>
  <rect x="80" y="690" width="480" height="40" fill="url(#hatch)" opacity="0.6"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#aaa" stroke-width="2"/>
    </pattern>
  </defs>
  <text x="320" y="748" font-size="12" text-anchor="middle" fill="#3b7ea1">WINDOW 2.3m wide × 1.54m high centred on wall (sill ≈ 0.56m, head 2.1m assumed)</text>

  <!-- Entry door cut-out and swing (hinge at east jamb, swings into room) -->
  <path d="M560,210 A108,108 0 0,1 452,102" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="560" y1="102" x2="452" y2="102" stroke="#c0392b" stroke-width="4"/>
  <path d="M560,102 L560,210 A108,108 0 0,1 452,102 Z" fill="#c0392b" opacity="0.08"/>
  <rect x="564" y="94" width="156" height="124" fill="#f2efe9"/><text x="642" y="186" font-size="12" text-anchor="middle" fill="#555">hallway</text><text x="574" y="146" font-size="12" fill="#c0392b" font-weight="bold">← ENTRY DOOR 0.9m</text><text x="574" y="162" font-size="11" fill="#c0392b">(east wall, NE corner)</text>

  <!-- Small floating drawer, north wall NW corner -->
  <rect x="98" y="94" width="72" height="42" fill="#7a5233" stroke="#4e3420" stroke-width="1.5"/>
  <text x="134" y="112" font-size="9" fill="#fff" text-anchor="middle">DRAWER</text>
  <text x="134" y="124" font-size="8" fill="#fff" text-anchor="middle">0.6×0.35</text>
  <text x="180" y="112" font-size="9" fill="#4e3420">wall-hung, top at 0.95m</text>
  <!-- Full-length mirror, west wall north end -->
  <rect x="84" y="156" width="6" height="108" fill="#9fc3d6" stroke="#b08d57" stroke-width="1.5"/>
  <text x="104" y="210" font-size="10" fill="#2e6f8e" text-anchor="middle" transform="rotate(-90 104 210)">MIRROR 0.9×2.0m</text>
  <rect x="116" y="150" width="232" height="96" fill="none" stroke="#2e6f8e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="232" y="194" font-size="10" fill="#2e6f8e" text-anchor="middle">dressing zone</text>
  <text x="232" y="210" font-size="10" fill="#2e6f8e" text-anchor="middle">~1.2m to nightstand · 1.7m to bed</text>
  <!-- Fluted walnut feature panel (west wall), no TV -->
  <rect x="84" y="312" width="5" height="240" fill="#7a5233"/>
  <text x="110" y="432" font-size="11" fill="#4e3420" text-anchor="middle" transform="rotate(-90 110 432)">FLUTED WALNUT FEATURE PANEL 2.0m</text>

  <!-- Rug under bed -->
  <rect x="180" y="286" width="270" height="292" rx="4" fill="#e9e2d6" stroke="#d6cbb8" stroke-width="1"/>

  <!-- King bed -->
  <rect x="206" y="316" width="258" height="232" rx="6" fill="#ffffff" stroke="#8a7a68" stroke-width="2"/>
  <rect x="206" y="316" width="130" height="232" rx="6" fill="#efe3c8" stroke="#8a7a68" stroke-width="1"/>
  <rect x="420" y="330" width="36" height="96" rx="10" fill="#f7f4ef" stroke="#a89886"/>
  <rect x="420" y="438" width="36" height="96" rx="10" fill="#f7f4ef" stroke="#a89886"/>
  <rect x="398" y="348" width="18" height="70" rx="6" fill="#b8a99a"/>
  <rect x="398" y="446" width="18" height="70" rx="6" fill="#b8a99a"/>
  <text x="300" y="400" font-size="14" text-anchor="middle" fill="#5c4033" font-weight="bold">KING BED</text>
  <text x="300" y="417" font-size="11" text-anchor="middle" fill="#5c4033">1.93 × 2.15m</text>

  <!-- Nightstands -->
  <rect x="410" y="256" width="54" height="56" fill="#7a5233" stroke="#4e3420"/>
  <rect x="410" y="552" width="54" height="56" fill="#7a5233" stroke="#4e3420"/>
  <circle cx="437" cy="284" r="9" fill="#f3e6c4" stroke="#b08d57" stroke-width="2"/>
  <circle cx="437" cy="580" r="9" fill="#f3e6c4" stroke="#b08d57" stroke-width="2"/>

  <!-- Headboard wall -->
  <rect x="464" y="258" width="12" height="348" fill="#4e3420"/>
  <text x="488" y="432" font-size="11" fill="#4e3420" text-anchor="middle" transform="rotate(90 488 432)">HEADBOARD WALL 2.9m × 1.2m high</text>

  <!-- Lounge nook (SW corner) -->
  <circle cx="150" cy="610" r="60" fill="#ece5da" stroke="#d6cbb8"/>
  <g transform="translate(152 612) rotate(-45)">
    <rect x="-43" y="-43" width="86" height="86" rx="22" fill="#b8a99a" stroke="#7d6e60" stroke-width="2"/>
    <rect x="-43" y="-43" width="86" height="20" rx="10" fill="#9c8d7e"/>
  </g>
  <circle cx="252" cy="640" r="22" fill="#e6dccb" stroke="#a89886" stroke-width="2"/>
  <circle cx="98" cy="562" r="9" fill="#b08d57"/>
  <text x="152" y="616" font-size="10" text-anchor="middle" fill="#fff">LOUNGE</text>
  <text x="152" y="628" font-size="10" text-anchor="middle" fill="#fff">CHAIR</text>
  <text x="252" y="644" font-size="9" text-anchor="middle" fill="#555">table</text>

  <!-- Dimensions -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="80" y1="72" x2="560" y2="72"/><line x1="80" y1="66" x2="80" y2="78"/><line x1="560" y1="66" x2="560" y2="78"/>
    <line x1="56" y1="90" x2="56" y2="678"/><line x1="50" y1="90" x2="62" y2="90"/><line x1="50" y1="678" x2="62" y2="678"/>
    <!-- foot walkway 0.75 -->
    <line x1="89" y1="488" x2="206" y2="488"/><line x1="89" y1="482" x2="89" y2="494"/><line x1="206" y1="482" x2="206" y2="494"/>
    <!-- walkway behind headboard 0.7 -->
    <line x1="476" y1="488" x2="560" y2="488"/><line x1="476" y1="482" x2="476" y2="494"/><line x1="560" y1="482" x2="560" y2="494"/>
    <!-- end clearance 1.0 -->
    <line x1="500" y1="90" x2="500" y2="258" stroke-dasharray="3,3"/>
    <line x1="500" y1="606" x2="500" y2="678" stroke-dasharray="3,3"/>
    <line x1="190" y1="432" x2="720" y2="432" stroke="#2e86c1" stroke-dasharray="8,4"/>
  </g>
  <text x="320" y="66" font-size="13" text-anchor="middle" fill="#333">4.0m</text>
  <text x="40" y="384" font-size="13" text-anchor="middle" fill="#333" transform="rotate(-90 40 384)">4.9m (west wall)</text>
  <text x="150" y="506" font-size="11" text-anchor="middle" fill="#333">≈1.0m</text>
  <text x="518" y="506" font-size="11" text-anchor="middle" fill="#333">0.7m</text>
  <text x="508" y="236" font-size="11" fill="#333">1.4m</text>
  <text x="508" y="648" font-size="11" fill="#333">0.6m</text>

  <!-- Legend -->
  <g font-size="11" fill="#444">
    <rect x="80" y="768" width="14" height="10" fill="#c0392b" opacity="0.5"/><text x="100" y="777">door swing (clear of headboard wall)</text>
    <rect x="320" y="768" width="14" height="10" fill="#7a5233"/><text x="340" y="777">walnut joinery</text>
    <line x1="450" y1="773" x2="470" y2="773" stroke="#3b7ea1" stroke-width="3"/><text x="476" y="777">glazing</text>
    <rect x="540" y="768" width="14" height="10" fill="#ebe7e2" stroke="#999"/><text x="560" y="777">robes (existing)</text>
    <line x1="320" y1="800" x2="340" y2="800" stroke="#b8a99a" stroke-width="3" stroke-dasharray="2,3"/><text x="346" y="804">curtain track fixed to flat ceiling</text>
    <line x1="80" y1="800" x2="100" y2="800" stroke="#2e86c1" stroke-dasharray="6,3" stroke-width="2"/><text x="106" y="804">bed centre = robe walkway centre</text>
  </g>
</svg>
